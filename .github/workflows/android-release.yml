name: android-release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android platform 37
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compute version
        id: version
        run: |
          VERSION="${TAG#android-v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected an android-vX.Y.Z release tag (optionally with a prerelease suffix)" >&2
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release
        env:
          FETCHARR_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FETCHARR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FETCHARR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FETCHARR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew test lint assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ github.run_number }}

      - name: Verify the APK is signed
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          case "$APK" in
            *unsigned*) echo "Release APK is unsigned: $APK" >&2; exit 1 ;;
          esac
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          OUT="fetcharr-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$OUT"
          echo "path=android/$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fetcharr Android ${{ steps.version.outputs.name }}
          prerelease: ${{ contains(steps.version.outputs.name, '-') }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
