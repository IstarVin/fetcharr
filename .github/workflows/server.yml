name: server

on:
  push:
    paths:
      - "server/**"
      - "contract/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "contract/**"
      - ".github/workflows/server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: server
