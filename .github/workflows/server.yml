name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "contract/**"
      - ".dockerignore"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "contract/**"
      - ".dockerignore"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: server

  # Make sure the release image still builds before a tag is pushed. Builds on
  # main also write the layer cache: tag-triggered release runs can read the
  # default branch's cache but not each other's, so this is what keeps
  # server-release warm. PRs only read it (amd64 only, for speed).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH_CACHE: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        if: env.PUBLISH_CACHE == 'true'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ env.PUBLISH_CACHE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          cache-from: type=gha
          cache-to: ${{ env.PUBLISH_CACHE == 'true' && 'type=gha,mode=max' || '' }}
